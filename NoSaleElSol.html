html,body{height:100%;overflow:hidden;background:#05050a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#5a5a70;touch-action:none;user-select:none;-webkit-user-select:none}

.dpad b{position:absolute;background:#1d1d28;border:2px solid #0b0b12;border-radius:8px;display:block}

.dn{left:44px;bottom:0;width:44px;height:48px}
.lf{left:0;top:44px;width:48px;height:44px}
.rt{right:0;top:44px;width:48px;height:44px}
.mid{left:44px;top:44px;width:44px;height:44px;border-radius:2px}
.abs{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.row2{display:flex;gap:14px;align-items:center}
.btn{width:60px;height:60px;border-radius:50%;background:#6b1f33;border:2px solid #0b0b12;color:#e8e8f5;font:700 20px/58px system-ui;text-align:center}
.btn.b{background:#1f3a6b}
.btn:active,.btn.on{filter:brightness(1.6)}
.mini{display:flex;gap:10px}
.sbtn{padding:5px 14px;border-radius:12px;background:#1d1d28;border:2px solid #0b0b12;color:#7a7a92;font:600 11px/1 system-ui;letter-spacing:.5px}

#hint{font-size:11px;letter-spacing:.4px;text-align:center;opacity:.5;padding:0 8px}

const GLYPHS = {};
(function parseFont(){
  for (const line of FONT_SRC.split('\n')) {
    if (!line.length) continue;
    const ch = line[0], top = +line[1];
    if (isNaN(top)) continue;
    const rows = line.slice(2).split('/');
    const pix = []; let w = 0;
    for (let y = 0; y < rows.length; y++) {
      for (let x = 0; x < rows[y].length; x++) {
        if (rows[y][x] === '#') { pix.push([x, top + y]); if (x + 1 > w) w = x + 1; }
      }
    }
    GLYPHS[ch] = { w: w || 3, pix };
  }
})();

const FONT_H = 9;                 // alto de linea
const _atlas = {};                // cache de atlas por color

function glyphAtlas(color) {
  if (_atlas[color]) return _atlas[color];
  const keys = Object.keys(GLYPHS);
  const cv = document.createElement('canvas');
  cv.width = keys.length * 8; cv.height = 8;
  const c = cv.getContext('2d');
  c.fillStyle = color;
  const pos = {};
  keys.forEach((k, i) => {
    pos[k] = i * 8;
    for (const [x, y] of GLYPHS[k].pix) c.fillRect(i * 8 + x, y, 1, 1);
  });
  return (_atlas[color] = { cv, pos });
}

function textWidth(s) {
  let w = 0;
  for (const ch of s) { const g = GLYPHS[ch] || GLYPHS['?']; w += g.w + 1; }
  return w > 0 ? w - 1 : 0;
}

// dibuja texto pixel-perfect
function drawText(c, s, x, y, color) {
  const a = glyphAtlas(color || '#101018');
  let cx = x | 0;
  for (const ch of s) {
    const g = GLYPHS[ch] || GLYPHS['?'];
    const p = a.pos[ch] !== undefined ? a.pos[ch] : a.pos['?'];
    c.drawImage(a.cv, p, 0, 8, 8, cx, y | 0, 8, 8);
    cx += g.w + 1;
  }
  return cx;
}

// parte un texto en lineas que entren en `maxw` pixeles
function wrapText(s, maxw) {
  const out = [];
  for (const para of String(s).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (textWidth(t) > maxw && line) { out.push(line); line = word; }
      else line = t;
    }
    out.push(line);
  }
  return out;
}

function makeSprite(art, extra) {
  const h = art.length, w = art[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = art[y][x];
    if (ch === '.' || ch === ' ') continue;
    const col = (extra && extra[ch]) || PAL[ch];
    if (!col) continue;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  return c;
}
function padArt(rows) {
  let w = 0; for (const r of rows) if (r.length > w) w = r.length;
  return rows.map(r => r + '.'.repeat(w - r.length));

function mkArt(rows, colors) { return makeSprite(padArt(rows), colors); }

}

function blit(s, x, y, sc) {
  sc = sc || 1;

function blitFlip(s, x, y, sc) {

  ctx.restore();
}
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

(function touchPad() {
  const pad = document.getElementById('pad');
  const coarse = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  if (coarse) pad.style.display = 'flex';
  const btns = [...pad.querySelectorAll('[data-k]')];
  const zones = () => btns.map(b => ({ b, r: b.getBoundingClientRect(), k: MAPK[b.dataset.k], raw: b.dataset.k }));
  let Z = zones(); addEventListener('resize', () => setTimeout(() => Z = zones(), 60));
  const active = new Map();
  function apply() {
    const on = new Set([...active.values()].flat());
    for (const z of Z) {
      const hit = on.has(z.raw);
      z.b.classList.toggle('on', hit);
      if (z.raw === 'KeyM') { if (hit && !z._m) { z._m = 1; Audio2.toggle(); } if (!hit) z._m = 0; }
      else setKey(z.k, hit ? 1 : 0);
    }
  }
  function upd(e) {
    e.preventDefault(); active.clear();
    for (const t of e.touches) {
      const hits = [];
      for (const z of Z) {
        const r = z.r, m = 6;
        if (t.clientX >= r.left - m && t.clientX <= r.right + m && t.clientY >= r.top - m && t.clientY <= r.bottom + m) hits.push(z.raw);
      }
      if (hits.length) active.set(t.identifier, hits);
    }
    apply(); Audio2.unlock();
  }
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => pad.addEventListener(ev, upd, { passive: false }));
  addEventListener('pointerdown', () => Audio2.unlock());
})();

  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}

const P_SIDE = [

  '....OHHHHHKKO...','....OKKKKKKKO...','....OKKKKOKKO...','....OKKKKKKKO...',

  '...OOSSSSSSOO...','....OPPPPPPO....','....OPPPPPPO....','....OZZZZZZO....'];
const LEGS2 = {
  d: ['...OPPPOOPPPO...','..OPPPPOOPPPPO..','..OZZO....OZZO..'],
  s: ['....OPPPPPPO....','...OPPPO.OPPO...','...OZZO...OZZO..']
};
const CAP_DOWN = ['', '', '', '', '..VVVVVVVVVVVV..'];
const CAP_SIDE = ['', '', '', '', '....VVVVVVVVVV..'];
const PELO_DOWN = ['', '', '', '', '', '..VV........VV..', '..VV........VV..', '..VV........VV..', '...V........V...'];

function buildPerson(col) {
  const c = k => PAL[k] || k;
  const C = {
    O: PAL['0'], H: c(col.pelo), K: c(col.piel || 'j'), S: c(col.remera),
    P: c(col.pant || 'c'), Z: c(col.zapas || '1'), V: c(col.extraCol || col.pelo)
  };
  function comp(base, over, legs) {
    let rows = base.slice();
    if (legs) rows = rows.slice(0, 13).concat(legs);
    if (over) rows = rows.map((r, i) => {
      const o = over[i]; if (!o) return r;
      let out = '';
      for (let x = 0; x < r.length; x++) out += (o[x] && o[x] !== '.') ? o[x] : r[x];
      return out;
    });
    return makeSprite(rows, C);
  }
  const over = col.gorra ? CAP_DOWN : (col.pelolargo ? PELO_DOWN : null);
  const overS = col.gorra ? CAP_SIDE : (col.pelolargo ? PELO_DOWN : null);
  const overU = col.gorra ? null : (col.pelolargo ? PELO_DOWN : null);
  return {
    d: [comp(P_DOWN, over, null), comp(P_DOWN, over, LEGS2.d)],
    u: [comp(P_UP, overU, null), comp(P_UP, overU, LEGS2.d)],
    s: [comp(P_SIDE, overS, null), comp(P_SIDE, overS, LEGS2.s)]
  };
}

function zonaActual() { return ZONAS[G.zona] ? G.zona : 'nunez'; }
function distZona(a, b) {
  if (!ZONAS[a] || !ZONAS[b]) return 0;
  const A = ZONAS[a], B = ZONAS[b];
  return Math.hypot(A.mx - B.mx, A.my - B.my);
}
function minutosViaje(a, b) {
  if (a === b || !ZONAS[a] || !ZONAS[b]) return 0;
  return 4 + Math.round(distZona(a, b) * 0.45) + (ZONAS[b].extra || 0) + (ZONAS[a].extra || 0);
}

const MIN_INICIO = 20 * 60, MIN_FINAL = 30 * 60;   // 600 minutos de juego
function relojTexto(m) {
  const t = m % 1440;
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}
function faltaTexto() {
  const f = Math.max(0, MIN_FINAL - G.min);
  return String(Math.floor(f / 60)).padStart(2, '0') + ':' + String(f % 60).padStart(2, '0');
}
function gastarMin(n) {
  G.min += n;
  if (G.min >= MIN_FINAL) G.min = MIN_FINAL;
}

let acumulado = 0, ultimo = 0;
function paso(dibujar) {
  if (dibujar === undefined) dibujar = true;
  if (fade.dir === 1) {
    fade.v += 0.08;
    if (fade.v >= 1) { fade.v = 1; fade.dir = -1; const c = fade.cb; fade.cb = null; c && c(); }
  } else if (fade.dir === -1) {
    fade.v -= 0.08; if (fade.v <= 0) { fade.v = 0; fade.dir = 0; }
  } else {
    if (modo === 'titulo') updTitulo();
    else if (modo === 'mundo') { updMundo(); chequear2010(); chequearCapitulo(); }
    else if (modo === 'dialogo') updDlg();
    else if (modo === 'mapa') updMapa();
    else if (modo === 'viaje') updViaje();
    else if (modo === 'duelo') updDuelo();
    else if (modo === 'libreta') updLibreta();
    else if (modo === 'epilogo') updEpilogo();
  }
  if (!dibujar) { clearPressed(); return; }

  if (modo === 'titulo') dibujarTitulo();
  else if (modo === 'mapa') dibujarMapaPartido();
  else if (modo === 'viaje') dibujarViaje();
  else if (modo === 'duelo') dibujarDuelo();
  else if (modo === 'libreta') dibujarLibreta();
  else if (modo === 'epilogo') dibujarEpilogo();
  else { camaraSeguir(); dibujarMundo(); if (modo === 'dialogo' && dlg) dibujarDlg(); }
  if (fade.v > 0) { ctx.fillStyle = 'rgba(3,3,8,' + fade.v + ')'; ctx.fillRect(0, 0, W, H); }
  clearPressed();
}
function bucle(t) {
  requestAnimationFrame(bucle);
  if (!ultimo) ultimo = t;
  let dt = t - ultimo; ultimo = t;
  if (dt > 250) dt = 250;
  acumulado += dt;
  let n = 0;
  while (acumulado >= 16.666 && n < 4) { acumulado -= 16.666; n++; paso(acumulado < 16.666 || n >= 4); }
}
reconstruirArte();
TIT.hay = !!loadGame();
resize();
requestAnimationFrame(bucle);
</script>
