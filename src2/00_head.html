<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="mobile-web-app-capable" content="yes">
<title>No sale el sol — Avellaneda 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05050a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#5a5a70;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px}
#screen{flex:0 0 auto;display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #16161f;border-radius:6px;box-shadow:0 0 0 2px #000,0 6px 22px rgba(0,0,0,.8)}
#pad{flex:0 0 auto;width:100%;max-width:460px;display:none;justify-content:space-between;align-items:center;padding:0 10px 4px;gap:8px}
.dpad{position:relative;width:132px;height:132px;flex:0 0 auto}
.dpad b{position:absolute;background:#1d1d28;border:2px solid #0b0b12;border-radius:8px;display:block}
.dpad b:active,.dpad b.on{background:#3a3a50}
.up{left:44px;top:0;width:44px;height:48px}
.dn{left:44px;bottom:0;width:44px;height:48px}
.lf{left:0;top:44px;width:48px;height:44px}
.rt{right:0;top:44px;width:48px;height:44px}
.mid{left:44px;top:44px;width:44px;height:44px;border-radius:2px}
.abs{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.row2{display:flex;gap:14px;align-items:center}
.btn{width:60px;height:60px;border-radius:50%;background:#6b1f33;border:2px solid #0b0b12;color:#e8e8f5;font:700 20px/58px system-ui;text-align:center}
.btn.b{background:#1f3a6b}
.btn:active,.btn.on{filter:brightness(1.6)}
.mini{display:flex;gap:10px}
.sbtn{padding:5px 14px;border-radius:12px;background:#1d1d28;border:2px solid #0b0b12;color:#7a7a92;font:600 11px/1 system-ui;letter-spacing:.5px}
.sbtn:active{background:#3a3a50}
#hint{font-size:11px;letter-spacing:.4px;text-align:center;opacity:.5;padding:0 8px}
@media (pointer:coarse){#hint{display:none}}
</style>
</head>
<body>
<div id="app">
<canvas id="screen" width="160" height="144"></canvas>
<div id="pad">
  <div class="dpad">
    <b class="up" data-k="ArrowUp"></b><b class="lf" data-k="ArrowLeft"></b>
    <b class="mid"></b>
    <b class="rt" data-k="ArrowRight"></b><b class="dn" data-k="ArrowDown"></b>
  </div>
  <div class="abs">
    <div class="row2"><b class="btn b" data-k="KeyX">B</b><b class="btn" data-k="KeyZ">A</b></div>
    <div class="mini"><b class="sbtn" data-k="Enter">LIBRETA</b><b class="sbtn" data-k="KeyM">SON</b></div>
  </div>
</div>
<div id="hint">Flechas = mover &nbsp;·&nbsp; Z = A &nbsp;·&nbsp; X = B &nbsp;·&nbsp; Enter = LIBRETA &nbsp;·&nbsp; M = musica</div>
</div>
